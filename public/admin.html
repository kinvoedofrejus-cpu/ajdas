<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace administrateur — AJDAS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1E4B32;
    --orange:#DE6E22;
    --teal:#1A8A78;
    --bg:#F5F7F1;
    --paper:#FFFFFF;
    --ink:#1B241C;
    --ink-soft:#4B564C;
    --line:#DCE3D8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.6;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;color:var(--green-deep);margin:0 0 .4em;letter-spacing:-.01em;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 90px;}
  header.bar{background:var(--green-deep);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;}
  header.bar img{width:38px;height:38px;border-radius:50%;flex:none;}
  header.bar span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;}
  label{display:block;font-size:.84rem;font-weight:600;margin:14px 0 6px;color:var(--ink-soft);}
  input[type=text], input[type=password], textarea, select{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:.96rem;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:80px;}
  input[type=file]{margin-top:2px;font-size:.9rem;}
  .btn{
    display:inline-block;margin-top:16px;padding:12px 24px;border-radius:999px;
    font-weight:600;font-size:.92rem;border:none;cursor:pointer;background:var(--orange);color:#fff;
  }
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:#B4472E;}
  .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .tabs button{
    padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
    font-weight:600;font-size:.87rem;cursor:pointer;color:var(--ink-soft);font-family:inherit;
    box-shadow:0 3px 0 rgba(0,0,0,.05);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tabs button:hover{transform:translateY(-1px);}
  .tabs button.active{
    background:linear-gradient(180deg, var(--green-deep), #123322);
    color:#fff;border-color:transparent;
    box-shadow:0 3px 0 #0a2016, 0 6px 14px rgba(30,75,50,.35);
    transform:translateY(1px);
  }
  .item-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .item-row:last-child{border-bottom:none;}
  .item-row .meta{min-width:0;flex:1;}
  .item-row .meta h4{margin:0;font-size:.94rem;overflow-wrap:anywhere;}
  .item-row .meta p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft);overflow-wrap:anywhere;}
  .msg{font-size:.86rem;margin-top:10px;}
  .msg.error{color:#B4472E;}
  .msg.ok{color:var(--teal);}
  #login-view{max-width:340px;margin:60px auto;padding:0 16px;}
  #login-view input{text-align:center;font-size:1.2rem;letter-spacing:.2em;}
  a.back{color:var(--ink-soft);font-size:.86rem;text-decoration:none;}
  [hidden]{display:none !important;}
  @media (max-width:600px){
    .wrap{padding:20px 14px 90px;}
    .card{padding:18px;}
  }
</style>
</head>
<body>

<header class="bar">
  <img src="/assets/logo.jpg" alt="Logo AJDAS">
  <span>AJDAS — Espace administrateur</span>
</header>

<div class="wrap">

  <!-- CONNEXION -->
  <div id="login-view">
    <div class="card">
      <h2>Gestion</h2>
      <p style="color:var(--ink-soft);font-size:.88rem;">Entrez le code d'accès de l'association.</p>
      <label for="code">Code</label>
      <input type="password" inputmode="numeric" id="code" autocomplete="off">
      <button class="btn" id="login-btn" style="width:100%;">Se connecter</button>
      <p class="msg error" id="login-msg" hidden></p>
    </div>
    <p><a class="back" href="/">← Retour au site</a></p>
  </div>

  <!-- PANNEAU ADMIN -->
  <div id="admin-view" hidden>
    <div class="tabs">
      <button data-type="project" class="active">Projets</button>
      <button data-type="image">Galerie</button>
      <button data-type="document">Documents</button>
      <button data-type="report">Rapports</button>
      <button data-type="settings">Paramètres</button>
    </div>

    <!-- Formulaire de publication (projets / galerie / documents) -->
    <div class="card" id="publish-card">
      <h2 id="form-title">Ajouter un projet</h2>
      <form id="upload-form">
        <label for="title">Titre</label>
        <input type="text" id="title" required>

        <label for="description">Description</label>
        <textarea id="description"></textarea>

        <div id="file-field">
          <label for="file" id="file-label">Photo</label>
          <input type="file" id="file" multiple>
        </div>

        <button type="submit" class="btn">Publier</button>
        <p class="msg" id="form-msg" hidden></p>
      </form>
    </div>

    <div class="card" id="list-card">
      <h3 id="list-title">Projets publiés</h3>
      <div id="items-list"></div>
      <p class="msg" id="list-empty" hidden style="color:var(--ink-soft);">Rien à afficher pour le moment.</p>
    </div>

    <!-- Paramètres : changer le code d'accès -->
    <div class="card" id="settings-card" hidden>
      <h2>Changer le code d'accès</h2>
      <p style="color:var(--ink-soft);font-size:.88rem;">Ce code est demandé à toute personne qui clique sur "Gestion" sur le site.</p>
      <form id="code-form">
        <label for="current-code">Code actuel</label>
        <input type="password" inputmode="numeric" id="current-code" required>

        <label for="new-code">Nouveau code</label>
        <input type="password" inputmode="numeric" id="new-code" required minlength="4">

        <label for="confirm-code">Confirmer le nouveau code</label>
        <input type="password" inputmode="numeric" id="confirm-code" required minlength="4">

        <button type="submit" class="btn">Mettre à jour le code</button>
        <p class="msg" id="code-msg" hidden></p>
      </form>
    </div>

    <button class="btn secondary" id="logout-btn">Se déconnecter</button>
    <p><a class="back" href="/">← Retour au site</a></p>
  </div>

</div>

<script>
const TYPE_LABELS = {
  project: { form: "Ajouter un projet", list: "Projets publiés", file: "Photo (optionnelle)", required: false, multiple: false },
  image:   { form: "Ajouter des photos", list: "Photos de la galerie", file: "Photo(s) — plusieurs possibles", required: true, multiple: true },
  document:{ form: "Ajouter des documents", list: "Documents en ligne", file: "Fichier(s) — plusieurs possibles (PDF, Word...)", required: true, multiple: true },
  report:  { form: "Ajouter des rapports", list: "Rapports publiés", file: "Fichier(s) — plusieurs possibles (PDF, Word...)", required: true, multiple: true },
};
let currentType = "project";

function getToken(){ return sessionStorage.getItem("ajdas_token"); }
function setToken(t){ sessionStorage.setItem("ajdas_token", t); }
function clearToken(){ sessionStorage.removeItem("ajdas_token"); }

function showAdmin(){
  document.getElementById("login-view").hidden = true;
  document.getElementById("admin-view").hidden = false;
  loadList();
}
function showLogin(){
  document.getElementById("login-view").hidden = false;
  document.getElementById("admin-view").hidden = true;
}

async function checkSession(){
  const token = getToken();
  if(!token) return showLogin();
  try{
    const res = await fetch("/api/session", { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    data.valid ? showAdmin() : (clearToken(), showLogin());
  }catch(e){ showLogin(); }
}

document.getElementById("login-btn").addEventListener("click", async ()=>{
  const code = document.getElementById("code").value.trim();
  const msg = document.getElementById("login-msg");
  msg.hidden = true;
  try{
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error || "Erreur de connexion."; msg.hidden = false; return; }
    setToken(data.token);
    showAdmin();
  }catch(e){ msg.textContent = "Impossible de se connecter."; msg.hidden = false; }
});
document.getElementById("code").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("logout-btn").addEventListener("click", ()=>{
  clearToken();
  showLogin();
});

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;

    const isSettings = currentType === "settings";
    document.getElementById("publish-card").hidden = isSettings;
    document.getElementById("list-card").hidden = isSettings;
    document.getElementById("settings-card").hidden = !isSettings;
    if(isSettings) return;

    const cfg = TYPE_LABELS[currentType];
    document.getElementById("form-title").textContent = cfg.form;
    document.getElementById("list-title").textContent = cfg.list;
    document.getElementById("file-label").textContent = cfg.file;
    document.getElementById("file").required = cfg.required;
    document.getElementById("file").multiple = !!cfg.multiple;
    document.getElementById("upload-form").reset();
    loadList();
  });
});

document.getElementById("upload-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("form-msg");
  msg.hidden = true;
  const form = new FormData();
  form.append("type", currentType);
  form.append("title", document.getElementById("title").value.trim());
  form.append("description", document.getElementById("description").value.trim());
  const fileInput = document.getElementById("file");
  Array.from(fileInput.files).forEach(f => form.append("file", f));

  try{
    const res = await fetch("/api/items", {
      method: "POST",
      headers: { Authorization: `Bearer ${getToken()}` },
      body: form,
    });
    const data = await res.json();
    if(!res.ok){ msg.className="msg error"; msg.textContent = data.error || "Erreur lors de la publication."; msg.hidden=false; return; }
    const count = (data.items || []).length;
    msg.className="msg ok";
    msg.textContent = count > 1 ? `${count} éléments publiés avec succès.` : "Publié avec succès.";
    msg.hidden=false;
    document.getElementById("upload-form").reset();
    loadList();
  }catch(err){
    msg.className="msg error"; msg.textContent = "Erreur réseau."; msg.hidden=false;
  }
});

async function loadList(){
  const container = document.getElementById("items-list");
  const empty = document.getElementById("list-empty");
  container.innerHTML = "";
  try{
    const res = await fetch(`/api/items?type=${currentType}`);
    const data = await res.json();
    const items = data.items || [];
    empty.hidden = items.length > 0;
    items.forEach(i=>{
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <div class="meta"><h4>${i.title}</h4><p>${i.description || ""}</p></div>
        <button class="btn danger" style="margin:0;padding:8px 14px;font-size:.8rem;">Supprimer</button>`;
      row.querySelector("button").addEventListener("click", ()=> removeItem(i.id));
      container.appendChild(row);
    });
  }catch(e){ /* ignore */ }
}

async function removeItem(id){
  if(!confirm("Supprimer cet élément ?")) return;
  await fetch(`/api/items/${id}`, {
    method: "DELETE",
    headers: { Authorization: `Bearer ${getToken()}` },
  });
  loadList();
}

/* --- Paramètres : changer le code d'accès --- */
document.getElementById("code-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("code-msg");
  msg.hidden = true;
  const current = document.getElementById("current-code").value.trim();
  const next = document.getElementById("new-code").value.trim();
  const confirmVal = document.getElementById("confirm-code").value.trim();

  if(next !== confirmVal){
    msg.className="msg error"; msg.textContent = "Les deux codes ne correspondent pas."; msg.hidden=false; return;
  }
  try{
    const res = await fetch("/api/settings/code", {
      method: "POST",
      headers: { "content-type":"application/json", Authorization: `Bearer ${getToken()}` },
      body: JSON.stringify({ current, next }),
    });
    const data = await res.json();
    if(!res.ok){ msg.className="msg error"; msg.textContent = data.error || "Erreur."; msg.hidden=false; return; }
    msg.className="msg ok"; msg.textContent = "Code mis à jour avec succès."; msg.hidden=false;
    document.getElementById("code-form").reset();
  }catch(err){
    msg.className="msg error"; msg.textContent = "Erreur réseau."; msg.hidden=false;
  }
});

checkSession();
</script>
</body>
</html>
